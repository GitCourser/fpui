[package]
name = "fpui"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "wgpu"] }
egui-wgpu = "0.31"
image = { version = "0.25", default-features = false, features = ["ico"] }
wgpu = { version = "24", features = ["dx12", "angle"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
