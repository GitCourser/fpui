[package]
name = "fpui"
version = "0.1.1"
edition = "2024"
build = "build.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
native-windows-gui = { version = "1.0.13", default-features = false, features = ["combobox", "embed-resource", "frame"] }
winapi = { version = "0.3", features = ["dwmapi", "winerror", "winreg", "winuser"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
